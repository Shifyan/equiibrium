<!doctype html>

<html class="dark" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Equilibrium Finance - Sign In</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Manrope:wght@600;700;800&amp;family=JetBrains+Mono:wght@500&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-secondary-container": "#aeb9d0",
              "secondary-container": "#3e495d",
              "on-background": "#d4e4fa",
              "surface-container-lowest": "#010f1f",
              "inverse-on-surface": "#233143",
              "tertiary-container": "#09182a",
              "on-secondary-fixed-variant": "#3c475a",
              "surface-container-low": "#0d1c2d",
              "on-error": "#690005",
              "on-tertiary": "#233144",
              "on-primary-fixed-variant": "#3f465c",
              "inverse-surface": "#d4e4fa",
              surface: "#051424",
              background: "#051424",
              "on-secondary": "#263143",
              "secondary-fixed": "#d8e3fb",
              "surface-bright": "#2c3a4c",
              "on-primary-fixed": "#131b2e",
              "on-primary": "#283044",
              "surface-container": "#122131",
              "on-surface-variant": "#c6c6cd",
              "error-container": "#93000a",
              error: "#ffb4ab",
              "tertiary-fixed": "#d5e3fd",
              "primary-container": "#0f172a",
              "primary-fixed": "#dae2fd",
              primary: "#bec6e0",
              "on-tertiary-container": "#738298",
              "surface-tint": "#bec6e0",
              "on-secondary-fixed": "#111c2d",
              "inverse-primary": "#565e74",
              "on-tertiary-fixed": "#0d1c2f",
              "tertiary-fixed-dim": "#b9c7e0",
              "on-error-container": "#ffdad6",
              tertiary: "#b9c7e0",
              "on-tertiary-fixed-variant": "#3a485c",
              "surface-container-highest": "#273647",
              "primary-fixed-dim": "#bec6e0",
              "on-primary-container": "#798098",
              secondary: "#bcc7de",
              "surface-dim": "#051424",
              "surface-container-high": "#1c2b3c",
              "surface-variant": "#273647",
              "secondary-fixed-dim": "#bcc7de",
              "on-surface": "#d4e4fa",
              "outline-variant": "#45464d",
              outline: "#909097",
            },
            borderRadius: {
              DEFAULT: "0.125rem",
              lg: "0.25rem",
              xl: "0.5rem",
              full: "0.75rem",
            },
            spacing: {
              md: "16px",
              "margin-mobile": "16px",
              gutter: "16px",
              xl: "32px",
              xs: "4px",
              "margin-desktop": "48px",
              sm: "8px",
              lg: "24px",
              base: "4px",
            },
            fontFamily: {
              "body-sm": ["Inter"],
              "body-lg": ["Inter"],
              "headline-md": ["Manrope"],
              "display-lg-mobile": ["Manrope"],
              "display-lg": ["Manrope"],
              "data-mono": ["JetBrains Mono"],
              "label-caps": ["Inter"],
            },
            fontSize: {
              "body-sm": ["14px", { lineHeight: "20px", fontWeight: "400" }],
              "body-lg": ["16px", { lineHeight: "24px", fontWeight: "400" }],
              "headline-md": [
                "20px",
                { lineHeight: "28px", fontWeight: "600" },
              ],
              "display-lg-mobile": [
                "24px",
                {
                  lineHeight: "32px",
                  letterSpacing: "-0.02em",
                  fontWeight: "700",
                },
              ],
              "display-lg": [
                "32px",
                {
                  lineHeight: "40px",
                  letterSpacing: "-0.02em",
                  fontWeight: "700",
                },
              ],
              "data-mono": ["14px", { lineHeight: "20px", fontWeight: "500" }],
              "label-caps": [
                "12px",
                {
                  lineHeight: "16px",
                  letterSpacing: "0.05em",
                  fontWeight: "600",
                },
              ],
            },
          },
        },
      };
    </script>
    <style>
      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 0,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
      }
      body {
        background-color: #051424;
      }
      /* Custom noise texture for background depth */
      .noise-overlay {
        background-image: url("https://www.transparenttextures.com/patterns/carbon-fibre.png");
        opacity: 0.03;
      }
    </style>
    <style>
      body {
        min-height: max(884px, 100dvh);
      }
    </style>
  </head>
  <body
    class="bg-background text-on-background min-h-screen flex flex-col font-body-lg"
  >
    <!-- Background Decor -->
    <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
      <div
        class="absolute top-[-10%] right-[-10%] w-[40vw] h-[40vw] bg-primary/5 blur-[120px] rounded-full"
      ></div>
      <div
        class="absolute bottom-[-10%] left-[-10%] w-[40vw] h-[40vw] bg-secondary/5 blur-[120px] rounded-full"
      ></div>
      <div class="noise-overlay absolute inset-0"></div>
    </div>
    <!-- Top Navigation Bar (Shared Component Reference - Hidden for Transactional) -->
    <header
      class="relative z-10 w-full flex items-center justify-center h-20 px-margin-mobile md:px-margin-desktop"
    >
      <div class="flex items-center gap-2">
        <span
          class="material-symbols-outlined text-primary text-3xl"
          style="font-variation-settings: &quot;FILL&quot; 1"
          >insights</span
        >
        <h1
          class="font-headline-md text-headline-md font-bold text-on-surface tracking-tight"
        >
          Equilibrium
        </h1>
      </div>
    </header>
    <main
      class="flex-grow flex items-center justify-center px-margin-mobile relative z-10"
    >
      <div
        class="w-full max-w-[420px] bg-surface-container border border-outline-variant p-xl rounded-xl"
      >
        <!-- Header Section -->
        <div class="text-center mb-xl">
          <h2
            class="font-display-lg-mobile text-display-lg-mobile text-on-surface mb-xs"
          >
            Welcome Back
          </h2>
          <p class="font-body-sm text-on-surface-variant">
            Enter your credentials to access your terminal
          </p>
        </div>
        <!-- Login Form -->
        <form
          action="#"
          class="space-y-lg"
          method="POST"
          onsubmit="event.preventDefault()"
        >
          <!-- Email Input -->
          <div class="space-y-sm">
            <label
              class="font-label-caps text-label-caps text-on-surface-variant uppercase"
              for="email"
              >Email Address</label
            >
            <div class="relative group">
              <span
                class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors"
                >mail</span
              >
              <input
                class="w-full bg-secondary-container border border-outline-variant rounded-lg py-3 pl-12 pr-md font-body-lg text-on-surface placeholder:text-outline focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-all"
                id="email"
                name="email"
                placeholder="name@example.com"
                required=""
                type="email"
              />
            </div>
          </div>
          <!-- Password Input -->
          <div class="space-y-sm">
            <div class="flex justify-between items-center">
              <label
                class="font-label-caps text-label-caps text-on-surface-variant uppercase"
                for="password"
                >Password</label
              >
              <a
                class="font-label-caps text-label-caps text-primary hover:text-primary-fixed transition-colors"
                href="#"
                >Forgot Password?</a
              >
            </div>
            <div class="relative group">
              <span
                class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors"
                >lock</span
              >
              <input
                class="w-full bg-secondary-container border border-outline-variant rounded-lg py-3 pl-12 pr-md font-body-lg text-on-surface placeholder:text-outline focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-all"
                id="password"
                name="password"
                placeholder="••••••••"
                required=""
                type="password"
              />
              <button
                class="absolute right-md top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors"
                type="button"
              >
                <span class="material-symbols-outlined">visibility</span>
              </button>
            </div>
          </div>
          <!-- Primary Action -->
          <button
            class="w-full bg-on-background text-surface font-headline-md text-headline-md py-3 rounded-lg hover:bg-white active:scale-[0.98] transition-all flex items-center justify-center gap-2"
            type="submit"
          >
            Sign In
            <span class="material-symbols-outlined text-xl">arrow_forward</span>
          </button>
        </form>
        <!-- Divider -->
        <div class="relative my-xl flex items-center py-2">
          <div class="flex-grow border-t border-outline-variant"></div>
          <span
            class="flex-shrink mx-4 font-label-caps text-label-caps text-outline uppercase"
            >Or continue with</span
          >
          <div class="flex-grow border-t border-outline-variant"></div>
        </div>
        <!-- Social Login Grid -->
        <div class="grid grid-cols-2 gap-md mb-xl">
          <button
            class="flex items-center justify-center gap-sm bg-surface-container-high border border-outline-variant py-3 rounded-lg hover:bg-surface-container-highest transition-colors group"
          >
            <svg
              class="w-5 h-5 fill-on-surface group-hover:fill-primary transition-colors"
              viewbox="0 0 24 24"
            >
              <path
                d="M12.48 10.92v3.28h7.84c-.24 1.84-.908 3.152-1.928 4.176-1.02 1.024-2.424 1.848-4.84 1.848-3.608 0-6.392-2.904-6.392-6.492s2.784-6.492 6.392-6.492c1.952 0 3.592.752 4.892 1.992l2.352-2.352C17.904 4.544 15.6 3.504 12.48 3.504c-5.184 0-9.44 4.256-9.44 9.44s4.256 9.44 9.44 9.44c2.856 0 5.184-.944 6.96-2.808 1.824-1.824 2.392-4.408 2.392-6.624 0-.624-.048-1.224-.144-1.744h-7.608z"
              ></path>
            </svg>
            <span class="font-body-sm font-semibold">Google</span>
          </button>
          <button
            class="flex items-center justify-center gap-sm bg-surface-container-high border border-outline-variant py-3 rounded-lg hover:bg-surface-container-highest transition-colors group"
          >
            <svg
              class="w-5 h-5 fill-on-surface group-hover:fill-primary transition-colors"
              viewbox="0 0 24 24"
            >
              <path
                d="M17.05 20.28c-.96 0-2.04-.6-3.22-.6-1.2 0-2.3.61-3.18.61-1.4 0-3.32-1.71-4.24-3.32-1.9-3.26-1.44-8.5 1.05-11.2 1.25-1.34 2.76-2.13 4.22-2.13 1.13 0 2.14.6 3.03.6.87 0 2.05-.6 3.25-.6 1.48 0 2.7.53 3.6 1.84-3.04 1.8-2.54 6.13.52 7.57-1.13 2.58-2.56 5.16-5.13 7.23zM15.47 4.1c-.8 1-1.96 1.6-3.1 1.5-.16-1.18.3-2.35 1.1-3.3 1-.82 2.2-1.4 3.2-1.3.16 1.18-.4 2.22-1.2 3.1z"
              ></path>
            </svg>
            <span class="font-body-sm font-semibold">Apple</span>
          </button>
        </div>
        <!-- Footer Link -->
        <div class="text-center">
          <p class="font-body-sm text-on-surface-variant">
            New to Equilibrium?
            <a class="text-primary font-bold hover:underline ml-xs" href="#"
              >Create an account</a
            >
          </p>
        </div>
      </div>
    </main>
    <!-- Decorative Data Visualization Component (Bottom Corner) -->
    <div
      class="fixed bottom-lg right-lg w-64 h-32 hidden lg:flex flex-col bg-surface-container-low border border-outline-variant rounded-xl p-md overflow-hidden animate-pulse"
    >
      <div class="flex justify-between items-center mb-sm">
        <span
          class="font-label-caps text-label-caps text-on-surface-variant uppercase"
          >Global Market Sentiment</span
        >
        <span
          class="text-[10px] bg-green-500/10 text-green-400 px-1.5 py-0.5 rounded font-bold"
          >STABLE</span
        >
      </div>
      <div class="flex-grow flex items-end gap-1">
        <div class="flex-1 bg-secondary-container h-[60%] rounded-t-sm"></div>
        <div class="flex-1 bg-secondary-container h-[40%] rounded-t-sm"></div>
        <div class="flex-1 bg-primary/40 h-[85%] rounded-t-sm"></div>
        <div class="flex-1 bg-secondary-container h-[55%] rounded-t-sm"></div>
        <div class="flex-1 bg-secondary-container h-[70%] rounded-t-sm"></div>
        <div class="flex-1 bg-primary/60 h-[95%] rounded-t-sm"></div>
        <div class="flex-1 bg-secondary-container h-[30%] rounded-t-sm"></div>
        <div class="flex-1 bg-secondary-container h-[50%] rounded-t-sm"></div>
      </div>
    </div>
    <!-- Footer Security Note -->
    <footer
      class="h-16 flex items-center justify-center px-margin-mobile relative z-10"
    >
      <div class="flex items-center gap-xs opacity-40">
        <span class="material-symbols-outlined text-sm">verified_user</span>
        <span class="font-label-caps text-label-caps uppercase"
          >AES-256 Bit Encryption Secured</span
        >
      </div>
    </footer>
    <script>
      // Subtle Mouse parallax for background elements
      document.addEventListener("mousemove", (e) => {
        const blobs = document.querySelectorAll(".fixed.inset-0 > div");
        const x = e.clientX / window.innerWidth;
        const y = e.clientY / window.innerHeight;

        blobs[0].style.transform = `translate(${x * 20}px, ${y * 20}px)`;
        blobs[1].style.transform = `translate(${x * -30}px, ${y * -30}px)`;
      });

      // Form interaction feedback
      const form = document.querySelector("form");
      const submitBtn = form.querySelector('button[type="submit"]');

      form.addEventListener("submit", () => {
        submitBtn.innerHTML = `<span class="material-symbols-outlined animate-spin">refresh</span> Processing...`;
        submitBtn.classList.add("opacity-80", "cursor-not-allowed");
        setTimeout(() => {
          submitBtn.innerHTML = `Success <span class="material-symbols-outlined">check_circle</span>`;
          submitBtn.classList.replace("bg-on-background", "bg-green-600");
        }, 1500);
      });
    </script>
  </body>
</html>
